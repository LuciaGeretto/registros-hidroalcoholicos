.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

let sb = null, SB_USER = null, PERFIL = null;
const colOf = path => path.split("/").slice(0, -1).join("/");
const snapDocSA = (path, row) => ({ id: path.split("/").pop(), exists: !!row, data: () => row ? row.data : undefined, metadata: { fromCache: false, hasPendingWrites: false } });
function dbErr(e) { const m = e?.message || String(e); return { code: /row-level|permiso|no existe|firmad|no se pueden/i.test(m) ? "invalid_argument" : "unavailable", message: m }; }
const saListeners = new Set(); let saChannel = null;
function ensureChannel() {
  if (saChannel) return;
  saChannel = sb.channel("docs-cambios").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => saListeners.forEach(l => { try { l(p); } catch (e) { } })).subscribe();
}
function docRefSA(path) {
  const ref = {
    id: path.split("/").pop(), path,
    async get() { const { data, error } = await sb.from("docs").select("path,data").eq("path", path).maybeSingle(); if (error) throw dbErr(error); return snapDocSA(path, data); },
    async set(d) { const { error } = await sb.from("docs").upsert({ path, col: colOf(path), data: d }); if (error) throw dbErr(error); },
    async update(d) { const { error } = await sb.rpc("doc_merge", { p: path, patch: d }); if (error) throw dbErr(error); },
    async delete() { const { error } = await sb.from("docs").delete().eq("path", path); if (error) throw dbErr(error); },
    onSnapshot(next, err) {
      let alive = true; ref.get().then(s => alive && next(s)).catch(e => alive && err && err(e)); ensureChannel();
      const l = p => { const r = p.new?.path ? p.new : p.old; if (!r || r.path !== path || !alive) return; next(snapDocSA(path, p.eventType === "DELETE" ? null : p.new)); };
      saListeners.add(l); return () => { alive = false; saListeners.delete(l); };
    },
    collection(c) { return colRefSA(path + "/" + c); },
  };

}
function colRefSA(path, ord = null, lim = null) {
  const shape = rows => { let r = rows.slice(); if (ord) { const [f, dir] = ord; r.sort((a, b) => { const x = a.data?.[f], y = b.data?.[f]; return (x < y ? -1 : x > y ? 1 : 0) * (dir === "desc" ? -1 : 1); }); } if (lim) r = r.slice(0, lim);
    const docs = r.map(x => snapDocSA(x.path, x)); return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] }; };
  const fetchAll = async () => { const { data, error } = await sb.from("docs").select("path,data").eq("col", path).range(0, 4999); if (error) throw dbErr(error); return data || []; };
  const q = {
    path, doc: id => docRefSA(path + "/" + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))),
    async add(d) { const r = q.doc(); await r.set(d); return r; },
    where: () => q, orderBy: (f, dir = "asc") => colRefSA(path, [f, dir], lim), limit: n => colRefSA(path, ord, n),
    async get() { return shape(await fetchAll()); },
    onSnapshot(next, err) {
      let alive = true; const map = new Map(); const emit = () => alive && next(shape([...map.values()]));
      fetchAll().then(rows => { rows.forEach(r => map.set(r.path, r)); emit(); }).catch(e => alive && err && err(e)); ensureChannel();
      const l = p => { const r = p.new?.path ? p.new : p.old; if (!r?.path || colOf(r.path) !== path) return; if (p.eventType === "DELETE") map.delete(r.path); else map.set(r.path, p.new); emit(); };
      saListeners.add(l); return () => { alive = false; saListeners.delete(l); };
    },
  };
  return q;
}
const dbSA = { doc: docRefSA, collection: p => colRefSA(p) };
const userSA = {
  id: async () => SB_USER?.id || null, isOwner: async () => !!PERFIL?.admin, canEdit: async () => !!PERFIL?.admin,
  can: async n => n === "data.write" ? !!PERFIL?.activo : null,
  me: async () => ({ id: SB_USER?.id || null, name: PERFIL?.nombre || "", avatarUrl: "", color: "#0E6876", email: null, isOwner: !!PERFIL?.admin, canEdit: !!PERFIL?.admin }),
  profiles: async ids => { const arr = [...new Set([].concat(ids))]; const m = {};
    const uu = arr.filter(i => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(i)));
    let rows = [];

    arr.forEach(i => { const r = rows.find(x => x.id === i); m[i] = { id: i, name: r?.nombre || r?.usuario || "", avatarUrl: "", color: "", email: null, isMe: i === SB_USER?.id, guest: false }; }); return m; },
  search: async () => [], name: async () => PERFIL?.nombre || "", email: async () => null, avatarUrl: async () => null,
};
const assetsSA = {
  async upload(blob) { const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + ".pdf";
    const { error } = await sb.storage.from("presea").upload(id, blob, { contentType: blob.type || "application/pdf" }); if (error) throw { code: "unavailable", message: error.message };

async function saEntrar(usuarioTipeado) {
  const { data: { user } } = await sb.auth.getUser(); SB_USER = user;
  if (!user) { saLoginView(); return; }
  let { data: perfil } = await sb.from("perfiles").select("*").eq("id", user.id).maybeSingle();
  if (!perfil) {
    const u = (usuarioTipeado || user.email).trim().toLowerCase().split("@")[0];
    const { data: ok } = await sb.rpc("reclamar_admin", { p_nombre: u, p_usuario: u });
    if (ok) ({ data: perfil } = await sb.from("perfiles").select("*").eq("id", user.id).maybeSingle());
  }
  if (!perfil || !perfil.activo) { await sb.auth.signOut(); saLoginView({ t: "Tu usuario no está habilitado. Pedile a la administradora que te dé de alta.", bad: true }); return; }
  PERFIL = perfil;
  window.claude = { use: async n => ({ db: dbSA, user: userSA, assets: assetsSA, downloads: downloadsSA }[n] ?? null) };
  saInactividad(); boot();
}
let saT = null;

  const { data: { session } } = await sb.auth.getSession();

}
